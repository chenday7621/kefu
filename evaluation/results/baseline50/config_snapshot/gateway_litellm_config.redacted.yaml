model_list:
  - model_name: mimo-v2.5-pro
    litellm_params:
      model: openai/deepseek-v4-flash
      api_base: https://dashscope.aliyuncs.com/compatible-mode/v1
      api_key: sk-REDACTED
      rpm: 3000
      tpm: 120000
  # Aliases required by answer/chat configs — routed to the same upstream
  - model_name: qwen3-max
    litellm_params:
      model: openai/deepseek-v4-flash
      api_base: https://dashscope.aliyuncs.com/compatible-mode/v1
      api_key: sk-REDACTED
      rpm: 3000
      tpm: 120000
  - model_name: qwen3.6-plus
    litellm_params:
      model: openai/deepseek-v4-flash
      api_base: https://dashscope.aliyuncs.com/compatible-mode/v1
      api_key: sk-REDACTED
      rpm: 3000
      tpm: 120000

litellm_settings:
  master_key: sk-REDACTED
  set_verbose: true
  drop_params: true
  request_timeout: 600

general_settings:
  store_model_in_db: false
  infer_model_from_keys: false
  background_health_checks: false

router_settings:
  routing_strategy: simple-shuffle
  allowed_fails: 3
  cooldown_time: 30
