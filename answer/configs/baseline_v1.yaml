llm:
  env_file: ../gateway/.env
  api_key_env: UPSTREAM_1_API_KEY
  base_url_env: UPSTREAM_1_BASE_URL
  model_name: deepseek-v4-flash
rewrite_llm:
  env_file: ../gateway/.env
  api_key_env: UPSTREAM_1_API_KEY
  base_url_env: UPSTREAM_1_BASE_URL
  model_name: deepseek-v4-flash
judge_llm:
  env_file: ../gateway/.env
  api_key_env: UPSTREAM_1_API_KEY
  base_url_env: UPSTREAM_1_BASE_URL
  model_name: deepseek-v4-flash

retrieval_top_k: 20
mid_top_k: 5
big_top_k: 3
retrieval_reload_policy: startup_once

small_layer:
  max_context_chars: 8000
  max_images: 20
  temperature: 0.1
  max_tokens: 2048
  timeout_seconds: 90.0
  max_retries: 2
  retry_backoff_seconds: 1.0
mid_layer:
  max_context_chars: 12000
  max_images: 20
  temperature: 0.1
  max_tokens: 3072
  timeout_seconds: 90.0
  max_retries: 2
big_layer:
  max_context_chars: 16000
  max_images: 20
  temperature: 0.1
  max_tokens: 3072
  timeout_seconds: 90.0
  max_retries: 2
ensemble_layer:
  max_context_chars: 4000
  max_images:
  temperature: 0.1
  max_tokens: 4096
  timeout_seconds: 90.0
  max_retries: 2

query_rewrite:
  enabled: true
  num_variants: 3
  temperature: 0.7
  max_tokens: 256
  timeout_seconds: 30.0
  max_retries: 1

include_images: true
image_dir: ../process/data/插图
max_workers: 4

# Formal V1 uses no QA-derived KG at runtime. Train-only inputs are prepared and
# audited separately, but the legacy all-350 graph must never be opened.
kg:
  enabled: false
  max_expanded: 8
  graph_db_root: ../kg/state/v1_train_only/graph.db
